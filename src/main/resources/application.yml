server:
  port: 8080

spring:
  application:
    name: MyLinkBuddy

  datasource:
    url: jdbc:postgresql://localhost:5432/mylinkbuddy
    username: mylinkbuddy
    password: mylinkbuddy
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Bookmark / BookmarkRequest tables are managed by Hibernate.
      ddl-auto: update
    show-sql: false
    open-in-view: false

  ai:
    azure:
      openai:
        # Org's APIM/Azure OpenAI sandbox - NOT public OpenAI. Endpoint and key are
        # environment-specific and must never be hardcoded; set AZURE_OPENAI_ENDPOINT and
        # AZURE_OPENAI_API_KEY as environment variables.
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        api-key: ${AZURE_OPENAI_API_KEY}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_CHAT_DEPLOYMENT:gpt-5.4-mini}
            temperature: 0.2
        embedding:
          options:
            deployment-name: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-small}
    vectorstore:
      pgvector:
        # Creates/verifies the vector_store table (with the pgvector extension) on startup.
        initialize-schema: true
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # Must match the embedding model's output dimension (text-embedding-3-small = 1536).
        dimensions: 1536

app:
  azure-openai:
    # The Azure SDK bundled with this Spring AI version doesn't define this exact preview
    # version as a selectable service version, so AzureOpenAiApiVersionConfig overrides the
    # api-version query parameter on every request to this literal value instead.
    api-version: ${AZURE_OPENAI_API_VERSION:2024-12-01-preview}

vaadin:
  launch-browser: false

logging:
  level:
    com.linkBuddy: INFO